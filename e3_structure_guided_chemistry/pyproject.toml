[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "e3-structure-guided-chemistry"
version = "0.2.1"
description = "Open-source structure-guided pharmacophore and fragment prioritisation for plant E3 ligases"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Peter Thorpe and collaborators"}]
dependencies = [
  "duckdb>=1.4,<2",
  "gemmi>=0.7,<1",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
fragments = [
  "rdkit>=2024.3,<2027",
]
dev = [
  "coverage>=7.6,<8",
  "pycodestyle>=2.12,<3",
  "pydocstyle>=6.3,<7",
  "pytest>=8,<9",
  "rdkit>=2024.3,<2027",
]

[project.scripts]
e3-chemistry = "e3chemistry.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.coverage.run]
branch = true
source = ["e3chemistry"]
omit = ["*/__main__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 95
precision = 2

[tool.pycodestyle]
max-line-length = 100
exclude = ".git,__pycache__,build,dist"

[tool.pydocstyle]
convention = "google"
add-ignore = ["D105", "D107"]
