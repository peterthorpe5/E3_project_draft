# Parameter-sensitivity experiment. Copy, rename and edit this file.
schema_version: 1
name: ligandability_threshold_sensitivity_v1
base_config: grant_aligned_reuse.cluster.template.yaml
strategy: cartesian
include_baseline: true
maximum_runs: 12
parameters:
  - path: analysis.ligandability.minimum_druggability_score
    values: [0.4, 0.5, 0.6]
  - path: analysis.prioritisation.minimum_structural_species_fraction
    values: [0.6, 0.75, 0.9]
