# Corrected-expression comparison run using Expression Atlas v0.5.1.
# Reuse only validated Stages 02-06, recompute Stages 07-08 with the
# v0.13.0 median-expression contract, and stop after Stage 08 before
# deciding which structural candidates require regeneration.
schema_version: 1
run:
  name: grant_aligned_corrected_expression_top200_v0_13_0_20260804
  mode: production
  project_root: /gpfs/uod-scale-01/cluster/gjb_lab/pthorpe001/2026_E3_protac/E3_project_draft
