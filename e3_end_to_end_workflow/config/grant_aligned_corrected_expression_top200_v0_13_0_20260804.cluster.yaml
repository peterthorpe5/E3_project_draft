  orthology_species_manifest: /gpfs/uod-scale-01/cluster/gjb_lab/pthorpe001/2026_E3_protac/E3_project_draft/e3_orthology_integration/config/species_manifest_results_feb26.tsv
  inherited_sqlite: /gpfs/uod-scale-01/cluster/gjb_lab/pthorpe001/2026_E3_protac/SSD_back_up_July_2026/Erin_Butterfield_data/Main_folder/E3_database/e3_ligase_sqlite_db.db
